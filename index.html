<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arcanix Market - Digital Assets & Code Marketplace</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- Top Sticky Navigation Bar -->
  <nav>
    <div class="nav-container">
      <a href="#home" class="brand-logo">Arcanix <span>Market</span></a>
      
      <div style="display: flex; gap: 8px; align-items: center;">
        <input type="text" id="global-search-input" placeholder="Search assets..." style="padding: 6px 12px; border-radius: var(--radius-md); border: 1px solid var(--border); font-size: 0.875rem;"/>
        <button id="search-btn" class="btn btn-outline" style="padding: 6px 12px;">🔍</button>
      </div>

      <div class="nav-actions">
        <a href="#cart" class="btn btn-outline">🛒 Cart (<span id="cart-count">0</span>)</a>
        <a href="#auth" id="account-nav-btn" class="btn btn-primary">Sign In</a>
      </div>
    </div>
  </nav>

  <!-- Dynamic Views Container -->
  <main class="container" id="app-view">
    <!-- Router injects views here -->
  </main>

  <!-- Global Scripts -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module">
    document.getElementById('search-btn').addEventListener('click', () => {
      const query = document.getElementById('global-search-input').value.trim();
      if (query) {
        window.location.hash = `search?q=${encodeURIComponent(query)}`;
      }
    });
  </script>
</body>
</html>
