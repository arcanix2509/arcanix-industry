<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>AI Multi-Vendor Marketplace</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <nav>
    <h2>AI Marketplace</h2>
    <div style="display: flex; align-items: center; gap: 15px;">
      <a href="index.html">Home</a>
      <a href="ai-advisor.html" style="color:#60a5fa; font-weight:bold;">✨ AI Advisor</a>
      
      <!-- Hidden Admin Panel Link (Shows only for Admin) -->
      <a href="admin.html" id="admin-panel-link" style="display: none; background: #e11d48; padding: 6px 12px; border-radius: 6px; color: white; text-decoration: none; font-size: 0.9rem;">⚙️ Admin Panel</a>

      <!-- Account Auth Link -->
      <a href="auth.html" id="nav-auth-btn" style="background: #2563eb; padding: 6px 12px; border-radius: 6px; color: white; text-decoration: none; font-size: 0.9rem;">Login / Register</a>
    </div>
  </nav>

  <div class="container">
    <h1 style="margin-bottom: 20px;">Explore Products</h1>
    <div id="product-grid" class="grid">
      <p>Loading products from Firestore...</p>
    </div>
  </div>

  <script type="module">
    import { db, auth, onAuthStateChanged, ADMIN_EMAIL } from './firebase-config.js';
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const adminPanelLink = document.getElementById('admin-panel-link');
    const navAuthBtn = document.getElementById('nav-auth-btn');

    // 🔒 1. Auth Observer: Check User Role & Dynamic Navigation
    onAuthStateChanged(auth, (user) => {
      if (user) {
        navAuthBtn.innerText = `Account (${user.displayName ? user.displayName.split(' ')[0] : 'User'})`;
        navAuthBtn.style.background = "#059669"; // Green tint when logged in
        
        if (user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
          adminPanelLink.style.display = "inline-block";
        } else {
          adminPanelLink.style.display = "none";
        }
      } else {
        navAuthBtn.innerText = "Login / Register";
        navAuthBtn.style.background = "#2563eb";
        adminPanelLink.style.display = "none";
      }
    });

    // 📦 2. Fetch & Render Catalog Items
    async function loadProducts() {
      const grid = document.getElementById('product-grid');
      try {
        const querySnapshot = await getDocs(collection(db, "products"));
        grid.innerHTML = '';

        if (querySnapshot.empty) {
          grid.innerHTML = '<p>No products added yet.</p>';
          return;
        }

        querySnapshot.forEach((doc) => {
          const product = doc.data();
          const cardHtml = `
            <div class="card">
              <img src="${product.imageUrl}" alt="${product.title}"/>
              <div class="card-content">
                <div class="card-title">${product.title}</div>
                <div class="card-price">$${product.price}</div>
                <a href="product.html?id=${doc.id}" class="btn">View &amp; Ask Gemini AI</a>
              </div>
            </div>
          `;
          grid.innerHTML += cardHtml;
        });
      } catch (error) {
        console.error("Error loading products:", error);
        grid.innerHTML = '<p style="color:red;">Error loading products. Check Firestore Security Rules or console logs.</p>';
      }
    }

    loadProducts();
  </script>
</body>
</html>
