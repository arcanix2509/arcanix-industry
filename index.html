<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Store</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <nav>
    <h2>⚡ AI Store</h2>
    <button class="menu-toggle" id="menu-toggle">☰</button>
    <div class="nav-links" id="nav-links">
      <a href="index.html">Home</a>
      <a href="ai-advisor.html" style="color: var(--primary);">✨ AI Advisor</a>
      <a href="admin.html" id="admin-panel-link" style="display: none; color: var(--danger);">⚙️ Admin</a>
      <a href="auth.html" id="nav-auth-btn" class="btn btn-primary">Login</a>
    </div>
  </nav>

  <div class="container">
    <div style="margin-bottom: 30px;">
      <h1 style="font-size: 1.8rem; font-weight: 700;">Marketplace Assets</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Find best AI tools and digital products.</p>
    </div>

    <div id="product-grid" class="grid">
      <p style="color: var(--text-muted);">Loading products...</p>
    </div>
  </div>

  <script type="module">
    import { db, auth, onAuthStateChanged, ADMIN_EMAIL } from './firebase-config.js';
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Mobile Navbar Toggle
    const menuToggle = document.getElementById('menu-toggle');
    const navLinks = document.getElementById('nav-links');
    menuToggle.addEventListener('click', () => navLinks.classList.toggle('active'));

    const adminPanelLink = document.getElementById('admin-panel-link');
    const navAuthBtn = document.getElementById('nav-auth-btn');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        navAuthBtn.innerText = user.displayName ? user.displayName.split(' ')[0] : 'Account';
        if (user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
          adminPanelLink.style.display = "inline-block";
        }
      } else {
        navAuthBtn.innerText = "Login";
        adminPanelLink.style.display = "none";
      }
    });

    async function loadProducts() {
      const grid = document.getElementById('product-grid');
      try {
        const querySnapshot = await getDocs(collection(db, "products"));
        grid.innerHTML = '';

        if (querySnapshot.empty) {
          grid.innerHTML = '<p style="color: var(--text-muted);">No products found.</p>';
          return;
        }

        querySnapshot.forEach((docSnap) => {
          const product = docSnap.data();
          grid.innerHTML += `
            <div class="card">
              <img src="${product.imageUrl || 'https://via.placeholder.com/300'}" alt="${product.title}"/>
              <div class="card-content">
                <div class="card-title">${product.title}</div>
                <div class="card-price">$${product.price}</div>
                <a href="product.html?id=${docSnap.id}" class="btn btn-primary" style="width:100%;">View Details</a>
              </div>
            </div>
          `;
        });
      } catch (error) {
        grid.innerHTML = '<p style="color: var(--danger);">Error loading products.</p>';
      }
    }

    loadProducts();
  </script>
</body>
</html>
