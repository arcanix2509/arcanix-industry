<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arcanix Market - Modern Ecommerce</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- Clean Flipkart-style Navbar -->
  <nav>
    <div class="nav-container">
      <a href="#home" class="brand-logo">
        Arcanix <span>Store ✦</span>
      </a>
      
      <div class="search-box">
        <input type="text" id="global-search-input" placeholder="Search products, items, code..."/>
        <button id="search-btn">🔍</button>
      </div>

      <div class="nav-actions">
        <a href="#auth" id="account-nav-btn" class="nav-btn-login">Login</a>
        <a href="#cart" class="nav-link-white">🛒 Cart (<span id="cart-count">0</span>)</a>
      </div>
    </div>
  </nav>

  <!-- Main View Container -->
  <main class="container" id="app-view">
    <!-- Router injects dynamic views here -->
  </main>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module">
    document.getElementById('search-btn').addEventListener('click', () => {
      const query = document.getElementById('global-search-input').value.trim();
      if (query) {
        window.location.hash = `search?q=${encodeURIComponent(query)}`;
      }
    });
  </script>
</body>
</html>
