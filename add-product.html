<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Product - Vendor Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <h2>Vendor Portal</h2>
    <div>
      <a href="index.html">Back to Home</a>
    </div>
  </nav>

  <div class="container">
    <div class="form-card">
      <h2 style="margin-bottom: 20px;">Add New Product</h2>
      <form id="add-product-form">
        <div class="form-group">
          <label>Product Title</label>
          <input type="text" id="title" required placeholder="e.g. Wireless Noise Canceling Headphones">
        </div>
        <div class="form-group">
          <label>Price ($)</label>
          <input type="number" id="price" required placeholder="e.g. 199">
        </div>
        <div class="form-group">
          <label>Product Description & Specs</label>
          <textarea id="description" rows="4" required placeholder="Mention features, warranty, stock info..."></textarea>
        </div>
        <div class="form-group">
          <label>Select Product Image (Auto Link Convert)</label>
          <input type="file" id="image" accept="image/*" required>
        </div>

        <div class="form-group" id="link-preview-group" style="display: none;">
          <label style="color: #16a34a; font-weight: bold;">Image Uploaded Successfully!</label>
          <input type="text" id="generated-image-url" readonly style="background: #f1f5f9; color: #475569; font-size: 0.85rem;">
          <img id="preview-img" src="" style="max-height: 100px; margin-top: 10px; border-radius: 6px;">
        </div>

        <button type="submit" id="submit-btn" class="btn">Publish Product</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { db, IMGBB_API_KEY } from './firebase-config.js';
    import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const form = document.getElementById('add-product-form');
    const imageInput = document.getElementById('image');
    const submitBtn = document.getElementById('submit-btn');
    const linkPreviewGroup = document.getElementById('link-preview-group');
    const generatedImageUrlInput = document.getElementById('generated-image-url');
    const previewImg = document.getElementById('preview-img');

    let uploadedImageUrl = "";

    // 1. File Selection -> Uploads to ImgBB and Gets Direct Link
    imageInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      submitBtn.innerText = "Uploading Image to Server...";
      submitBtn.disabled = true;

      try {
        const formData = new FormData();
        formData.append("image", file);

        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData,
        });

        const data = await response.json();

        if (data.success) {
          uploadedImageUrl = data.data.url;
          generatedImageUrlInput.value = uploadedImageUrl;
          previewImg.src = uploadedImageUrl;
          linkPreviewGroup.style.display = "block";
        } else {
          alert("ImgBB Upload Failed: Check your internet or ImgBB key.");
        }
      } catch (err) {
        console.error("Image Upload Error:", err);
        alert("Image upload failed.");
      } finally {
        submitBtn.innerText = "Publish Product";
        submitBtn.disabled = false;
      }
    });

    // 2. Submit Form Data to Firestore
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const title = document.getElementById('title').value;
      const price = document.getElementById('price').value;
      const description = document.getElementById('description').value;

      if (!uploadedImageUrl) {
        return alert("Please select an image and wait for it to finish uploading!");
      }

      submitBtn.innerText = "Saving Product to Firestore...";
      submitBtn.disabled = true;

      try {
        await addDoc(collection(db, "products"), {
          title: title,
          price: Number(price),
          description: description,
          imageUrl: uploadedImageUrl,
          createdAt: new Date()
        });

        alert("🎉 Product Successfully Published!");
        window.location.href = "index.html";

      } catch (error) {
        console.error("Firestore Save Error:", error);
        alert("Firestore Error: " + error.message + "\n\nMake sure your Firestore Rules allow reads and writes!");
        submitBtn.innerText = "Publish Product";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
