<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Login / Sign Up - AI Marketplace</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <nav>
    <h2>AI Marketplace</h2>
    <div>
      <a href="index.html">Back to Home</a>
    </div>
  </nav>

  <div class="container" style="max-width: 450px;">
    <div class="form-card" style="text-align: center; margin-top: 50px;">
      <h2 style="margin-bottom: 10px;">Welcome Back</h2>
      <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 25px;">Sign in to access your account &amp; admin controls</p>
      
      <div id="user-profile-box" style="display: none; margin-bottom: 20px;">
        <img id="user-avatar" src="" alt="Avatar" style="width: 80px; height: 80px; border-radius: 50%; margin-bottom: 10px; border: 2px solid #2563eb;"/>
        <h3 id="user-name"></h3>
        <p id="user-email" style="color: #64748b; font-size: 0.85rem;"></p>
      </div>

      <button id="google-login-btn" class="btn" style="background: #4285F4; font-size: 1rem; padding: 12px;">
        Login with Google
      </button>

      <button id="logout-btn" class="btn" style="background: #dc2626; font-size: 1rem; padding: 12px; display: none;">
        Sign Out
      </button>
    </div>
  </div>

  <script type="module">
    import { auth, googleProvider, signInWithPopup, signOut, onAuthStateChanged, ADMIN_EMAIL } from './firebase-config.js';

    const loginBtn = document.getElementById('google-login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userProfileBox = document.getElementById('user-profile-box');
    const userAvatar = document.getElementById('user-avatar');
    const userName = document.getElementById('user-name');
    const userEmail = document.getElementById('user-email');

    loginBtn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (err) {
        alert("Login Error: " + err.message);
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await signOut(auth);
      alert("Logged out successfully.");
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginBtn.style.display = "none";
        logoutBtn.style.display = "block";
        userProfileBox.style.display = "block";
        
        userAvatar.src = user.photoURL || 'https://via.placeholder.com/80';
        userName.innerText = user.displayName;
        userEmail.innerText = user.email;

        // Admin auto-redirect
        if (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
          setTimeout(() => {
            window.location.href = "admin.html";
          }, 1200);
        }
      } else {
        loginBtn.style.display = "block";
        logoutBtn.style.display = "none";
        userProfileBox.style.display = "none";
      }
    });
  </script>
</body>
</html>
