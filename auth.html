<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auth - Arcanix</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <nav>
    <div class="nav-container">
      <a href="index.html" class="brand-logo">Arcanix <span>PRO</span></a>
      <a href="index.html" class="btn btn-outline">← Back to Store</a>
    </div>
  </nav>

  <div class="container">
    <div class="form-card">
      
      <!-- Account Info (Log in hone par dikhega) -->
      <div id="user-profile-view" style="display: none; text-align: center;">
        <img id="user-avatar" style="width: 72px; height: 72px; border-radius: 50%; margin-bottom: 12px; border: 2px solid var(--border); object-fit: cover;"/>
        <h3 id="user-name" style="font-size: 1.1rem; font-weight: 700;"></h3>
        <p id="user-email" style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 24px;"></p>
        
        <a href="admin.html" id="admin-panel-btn" class="btn btn-danger" style="display: none; width: 100%; margin-bottom: 10px;">⚙️ Admin Panel</a>
        <button id="logout-btn" class="btn btn-outline" style="width: 100%;">Sign Out</button>
      </div>

      <!-- Auth Form (Log in na hone par dikhega) -->
      <div id="auth-forms-view">
        <h2 style="font-size: 1.25rem; font-weight: 700; text-align: center; margin-bottom: 20px;">Welcome Back</h2>

        <!-- Google Login Button -->
        <button id="google-login-btn" class="btn btn-outline" style="width: 100%; margin-bottom: 16px;">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Continue with Google
        </button>

        <div style="text-align: center; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 16px;">OR EMAIL</div>

        <form id="email-auth-form">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="auth-email" required placeholder="name@domain.com"/>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="auth-password" required placeholder="••••••••"/>
          </div>
          <div style="display: flex; gap: 10px;">
            <button type="submit" id="btn-login" class="btn btn-primary" style="flex: 1;">Sign In</button>
            <button type="button" id="btn-signup" class="btn btn-outline" style="flex: 1;">Register</button>
          </div>
        </form>
      </div>

    </div>
  </div>

  <script type="module">
    import { auth, googleProvider, signInWithPopup, signOut, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, ADMIN_EMAIL } from './firebase-config.js';

    const googleBtn = document.getElementById('google-login-btn');
    const authForm = document.getElementById('email-auth-form');
    const btnSignup = document.getElementById('btn-signup');
    const authFormsView = document.getElementById('auth-forms-view');
    const userProfileView = document.getElementById('user-profile-view');

    // Google Sign-In Fix
    googleBtn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (error) {
        console.error("Google Auth Error:", error);
        alert("Google Sign-In failed: " + error.message);
      }
    });

    // Email Login
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-password').value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (error) {
        alert("Login failed: " + error.message);
      }
    });

    // Email Registration
    btnSignup.addEventListener('click', async () => {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-password').value;
      if (!email || !pass) {
        alert("Please enter email and password to register.");
        return;
      }
      try {
        await createUserWithEmailAndPassword(auth, email, pass);
        alert("Account created successfully!");
      } catch (error) {
        alert("Registration failed: " + error.message);
      }
    });

    // Logout Button
    document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

    // Monitor Auth State
    onAuthStateChanged(auth, (user) => {
      if (user) {
        authFormsView.style.display = "none";
        userProfileView.style.display = "block";
        document.getElementById('user-avatar').src = user.photoURL || `https://api.dicebear.com/7.x/bottts/svg?seed=${user.uid}`;
        document.getElementById('user-name').innerText = user.displayName || 'Arcanix User';
        document.getElementById('user-email').innerText = user.email;

        if (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
          document.getElementById('admin-panel-btn').style.display = "block";
        }
      } else {
        authFormsView.style.display = "block";
        userProfileView.style.display = "none";
      }
    });
  </script>
</body>
</html>
