<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Account Access</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .auth-card {
      max-width: 400px;
      margin: 60px auto;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 35px 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .auth-nav {
      display: flex;
      gap: 15px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 25px;
    }
    .auth-nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding-bottom: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .auth-nav-btn.active {
      color: #60a5fa;
      border-bottom: 2px solid #60a5fa;
    }
    .google-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }
    .google-btn:hover { background: rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body>

  <nav>
    <h2>⚡ AI Marketplace</h2>
    <a href="index.html">← Back to Store</a>
  </nav>

  <div class="auth-card">
    <div id="user-profile-view" style="display: none; text-align: center;">
      <img id="user-avatar" style="width: 80px; height: 80px; border-radius: 50%; border: 2px solid #3b82f6; margin-bottom: 15px;"/>
      <h3 id="user-name"></h3>
      <p id="user-email" style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 25px;"></p>
      
      <a href="admin.html" id="admin-panel-btn" class="btn" style="display: none; background: rgba(225, 29, 72, 0.2); border: 1px solid #e11d48; color: #fda4af; margin-bottom: 10px;">⚙️ Open Admin Control Center</a>
      <button id="logout-btn" class="btn" style="background: rgba(244, 63, 94, 0.2); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.3);">Sign Out</button>
    </div>

    <div id="auth-forms-view">
      <div class="auth-nav">
        <button id="tab-login" class="auth-nav-btn active">Login</button>
        <button id="tab-register" class="auth-nav-btn">Register</button>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" required placeholder="you@example.com"/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" required placeholder="••••••••"/>
        </div>
        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>

      <form id="register-form" style="display: none;">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" required placeholder="you@example.com"/>
        </div>
        <div class="form-group">
          <label>Create Password</label>
          <input type="password" id="reg-password" required placeholder="Minimum 6 characters"/>
        </div>
        <button type="submit" class="btn" style="background: #10b981; color: white;">Create Account</button>
      </form>

      <button id="google-login-btn" class="btn google-btn">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Google
      </button>
    </div>
  </div>

  <script type="module">
    import { auth, googleProvider, signInWithPopup, signOut, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, ADMIN_EMAIL } from './firebase-config.js';

    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const authFormsView = document.getElementById('auth-forms-view');
    const userProfileView = document.getElementById('user-profile-view');

    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      loginForm.style.display = 'block';
      registerForm.style.display = 'none';
    });

    tabRegister.addEventListener('click', () => {
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      registerForm.style.display = 'block';
      loginForm.style.display = 'none';
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value);
      } catch (err) { alert(err.message); }
    });

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await createUserWithEmailAndPassword(auth, document.getElementById('reg-email').value, document.getElementById('reg-password').value);
      } catch (err) { alert(err.message); }
    });

    document.getElementById('google-login-btn').addEventListener('click', () => signInWithPopup(auth, googleProvider));
    document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      if (user) {
        authFormsView.style.display = "none";
        userProfileView.style.display = "block";
        document.getElementById('user-avatar').src = user.photoURL || `https://api.dicebear.com/7.x/bottts/svg?seed=${user.uid}`;
        document.getElementById('user-name').innerText = user.displayName || 'Marketplace Member';
        document.getElementById('user-email').innerText = user.email;

        if (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
          document.getElementById('admin-panel-btn').style.display = "block";
        }
      } else {
        authFormsView.style.display = "block";
        userProfileView.style.display = "none";
      }
    });
  </script>
</body>
</html>
