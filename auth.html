<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Authentication - AI Marketplace</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .auth-wrapper {
      max-width: 420px;
      margin: 40px auto;
      padding: 0 15px;
    }
    .auth-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
    }
    .auth-tabs {
      display: flex;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 25px;
    }
    .auth-tab {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s;
    }
    .auth-tab.active {
      color: #2563eb;
      border-bottom: 3px solid #2563eb;
      margin-bottom: -2px;
    }
    .divider-container {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: #94a3b8;
      font-size: 0.85rem;
    }
    .divider-container::before, .divider-container::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e2e8f0;
    }
    .divider-container span {
      padding: 0 10px;
    }
    .google-btn {
      background-color: #ffffff;
      color: #374151;
      border: 1px solid #d1d5db;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 600;
    }
    .google-btn:hover {
      background-color: #f9fafb;
    }
    .status-msg {
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 15px;
      display: none;
    }
    .status-error { background: #fee2e2; color: #991b1b; }
    .status-success { background: #dcfce7; color: #166534; }
  </style>
</head>
<body>

  <nav>
    <h2>AI Marketplace</h2>
    <div>
      <a href="index.html">Back to Home</a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Status Alert Box -->
      <div id="status-msg" class="status-msg"></div>

      <!-- Logged In User Profile View -->
      <div id="user-profile-view" style="display: none; text-align: center;">
        <img id="user-avatar" src="" alt="Profile" style="width: 80px; height: 80px; border-radius: 50%; margin-bottom: 12px; border: 2px solid #2563eb; object-fit: cover;"/>
        <h3 id="user-name" style="margin-bottom: 4px;"></h3>
        <p id="user-email" style="color: #64748b; font-size: 0.85rem; margin-bottom: 20px;"></p>
        
        <a href="admin.html" id="admin-panel-btn" class="btn" style="display: none; background: #e11d48; margin-bottom: 10px;">⚙️ Access Admin Dashboard</a>
        <a href="index.html" class="btn" style="background: #2563eb; margin-bottom: 10px;">🛍️ Go to Marketplace</a>
        <button id="logout-btn" class="btn" style="background: #dc2626;">Sign Out</button>
      </div>

      <!-- Authentication Forms -->
      <div id="auth-forms-view">
        <div class="auth-tabs">
          <button id="tab-login" class="auth-tab active">Sign In</button>
          <button id="tab-register" class="auth-tab">Register</button>
        </div>

        <!-- Email/Password Login -->
        <form id="login-form">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="login-email" required placeholder="name@example.com"/>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" required placeholder="••••••••"/>
          </div>
          <button type="submit" id="login-submit-btn" class="btn" style="background: #2563eb;">Sign In</button>
        </form>

        <!-- Email/Password Registration -->
        <form id="register-form" style="display: none;">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="reg-email" required placeholder="name@example.com"/>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="reg-password" required placeholder="Minimum 6 characters"/>
          </div>
          <button type="submit" id="reg-submit-btn" class="btn" style="background: #16a34a;">Create Account</button>
        </form>

        <div class="divider-container"><span>OR</span></div>

        <button id="google-login-btn" class="btn google-btn">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Continue with Google
        </button>
      </div>

    </div>
  </div>

  <script type="module">
    import { 
      auth, 
      googleProvider, 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword,
      ADMIN_EMAIL 
    } from './firebase-config.js';

    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    
    const authFormsView = document.getElementById('auth-forms-view');
    const userProfileView = document.getElementById('user-profile-view');
    const userAvatar = document.getElementById('user-avatar');
    const userName = document.getElementById('user-name');
    const userEmail = document.getElementById('user-email');
    const adminPanelBtn = document.getElementById('admin-panel-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const statusMsg = document.getElementById('status-msg');

    function showStatus(message, isError = false) {
      statusMsg.innerText = message;
      statusMsg.className = `status-msg ${isError ? 'status-error' : 'status-success'}`;
      statusMsg.style.display = 'block';
    }

    function clearStatus() {
      statusMsg.style.display = 'none';
    }

    // Switch Tabs
    tabLogin.addEventListener('click', () => {
      clearStatus();
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      loginForm.style.display = 'block';
      registerForm.style.display = 'none';
    });

    tabRegister.addEventListener('click', () => {
      clearStatus();
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      registerForm.style.display = 'block';
      loginForm.style.display = 'none';
    });

    // 1. Email Sign In
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearStatus();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        showStatus("Logged in successfully!");
      } catch (err) {
        showStatus(err.message, true);
      }
    });

    // 2. Email Sign Up
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearStatus();
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;

      try {
        await createUserWithEmailAndPassword(auth, email, password);
        showStatus("Account created successfully!");
      } catch (err) {
        showStatus(err.message, true);
      }
    });

    // 3. Google Sign In
    document.getElementById('google-login-btn').addEventListener('click', async () => {
      clearStatus();
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (err) {
        showStatus(err.message, true);
      }
    });

    // 4. Sign Out
    logoutBtn.addEventListener('click', async () => {
      await signOut(auth);
      clearStatus();
    });

    // 5. Auth Observer
    onAuthStateChanged(auth, (user) => {
      if (user) {
        authFormsView.style.display = "none";
        userProfileView.style.display = "block";
        
        userAvatar.src = user.photoURL || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + user.uid;
        userName.innerText = user.displayName || 'Marketplace User';
        userEmail.innerText = user.email;

        if (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
          adminPanelBtn.style.display = "block";
        } else {
          adminPanelBtn.style.display = "none";
        }
      } else {
        authFormsView.style.display = "block";
        userProfileView.style.display = "none";
      }
    });
  </script>
</body>
</html>
