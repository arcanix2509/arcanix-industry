<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Shopping Advisor</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <nav>
    <h2>⚡ AI Store</h2>
    <button class="menu-toggle" id="menu-toggle">☰</button>
    <div class="nav-links" id="nav-links">
      <a href="index.html">Home</a>
      <a href="ai-advisor.html" style="color: var(--primary);">✨ AI Advisor</a>
      <a href="auth.html" id="nav-auth-btn" class="btn btn-primary">Login</a>
    </div>
  </nav>

  <div class="container">
    <div class="chat-container">
      <div class="chat-header">
        <div class="chat-header-icon">✨</div>
        <div>
          <h3 style="font-size: 1rem; font-weight: 700;">Marketplace AI Advisor</h3>
          <p style="font-size: 0.75rem; color: var(--text-muted);">Ask me anything about products, pricing, or recommendations.</p>
        </div>
      </div>

      <div class="chat-messages" id="chat-messages">
        <div class="message ai">
          Hello! I'm your AI shopping assistant. How can I help you find the right asset today?
        </div>
      </div>

      <form id="chat-form" class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Type your question..." required autocomplete="off"/>
        <button type="submit" class="btn btn-primary" style="width: auto;">Send</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { GEMINI_API_KEY } from './firebase-config.js';

    // Mobile Navbar Toggle
    document.getElementById('menu-toggle').addEventListener('click', () => {
      document.getElementById('nav-links').classList.toggle('active');
    });

    const chatMessages = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');

    function appendMessage(text, sender) {
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      msg.innerText = text;
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const userText = chatInput.value.trim();
      if (!userText) return;

      appendMessage(userText, 'user');
      chatInput.value = '';

      const loadingMsg = document.createElement('div');
      loadingMsg.className = 'message ai';
      loadingMsg.innerText = 'Thinking...';
      chatMessages.appendChild(loadingMsg);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: userText }] }]
          })
        });

        const data = await response.json();
        chatMessages.removeChild(loadingMsg);

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          appendMessage(data.candidates[0].content.parts[0].text, 'ai');
        } else {
          appendMessage("Sorry, I couldn't process that response.", 'ai');
        }
      } catch (err) {
        chatMessages.removeChild(loadingMsg);
        appendMessage("Error communicating with AI service.", 'ai');
      }
    });
  </script>
</body>
</html>
