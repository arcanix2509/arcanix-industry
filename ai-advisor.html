<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Shopping Advisor</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <nav>
    <div class="nav-container">
      <a href="index.html" class="brand-logo">Arcanix <span>PRO</span></a>
      <a href="index.html" class="nav-link">← Marketplace</a>
    </div>
  </nav>

  <div class="container" style="max-width: 800px;">
    <div class="chat-container">
      <div class="chat-header">
        <div style="width: 36px; height: 36px; background: var(--primary-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary); font-weight: bold;">✨</div>
        <div>
          <h3 style="font-size: 1rem; font-weight: 700;">Arcanix Store AI Advisor</h3>
          <p style="font-size: 0.75rem; color: var(--text-muted);">Get asset recommendations and compatibility checks.</p>
        </div>
      </div>

      <div class="chat-messages" id="chat-messages">
        <div class="message ai">Hello! Tell me what you're building today, and I'll find the best assets for your project.</div>
      </div>

      <form id="chat-form" class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Type your project requirement..." required autocomplete="off"/>
        <button type="submit" class="btn btn-primary" style="width: auto;">Send</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { GEMINI_API_KEY } from './firebase-config.js';

    const chatMessages = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');

    function appendMessage(text, sender) {
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      msg.innerText = text;
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return msg;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const userText = chatInput.value.trim();
      if (!userText) return;

      appendMessage(userText, 'user');
      chatInput.value = '';

      const loadingMsg = appendMessage('Consulting catalog...', 'ai');

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: userText }] }] })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          loadingMsg.innerText = data.candidates[0].content.parts[0].text;
        } else {
          loadingMsg.innerText = "Sorry, I could not complete your request.";
        }
      } catch (err) {
        loadingMsg.innerText = "Error contacting AI system.";
      }
    });
  </script>
</body>
</html>
