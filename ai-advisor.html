<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>AI Shopping Advisor &amp; Discussion</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <nav>
    <h2>AI Marketplace</h2>
    <div>
      <a href="index.html">Home</a>
      <a href="ai-advisor.html" style="font-weight:bold; color:#60a5fa;">🤖 AI Advisor</a>
    </div>
  </nav>

  <div class="container">
    <h1 style="margin-bottom: 10px;">✨ Gemini AI Shopping Advisor</h1>
    <p style="margin-bottom: 25px; color: #64748b;">Get personalized recommendations and compare items directly with Google Gemini!</p>

    <div class="product-detail-container" style="grid-template-columns: 1fr;">
      <div class="chat-box" style="height: 550px;">
        <div class="chat-header">✨ Marketplace AI Assistant (Powered by Gemini)</div>
        <div class="chat-messages" id="chat-messages">
          <div class="message bot-msg">Hello! I am your Gemini AI Shopping Assistant. How can I help you choose the right product today?</div>
        </div>
        <form class="chat-input-form" id="chat-form">
          <input type="text" id="chat-input" placeholder="e.g. Recommend a product under $150..." required/>
          <button type="submit" class="btn" style="width: auto; margin:0;">Ask AI</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    import { db, GEMINI_API_KEY } from './firebase-config.js';
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const chatMessages = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');

    let allProducts = [];

    async function loadCatalog() {
      try {
        const querySnapshot = await getDocs(collection(db, "products"));
        allProducts = [];
        querySnapshot.forEach(doc => {
          allProducts.push(doc.data());
        });
      } catch (err) {
        console.error("Error loading catalog:", err);
      }
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const userText = chatInput.value.trim();
      if (!userText) return;

      appendMessage(userText, 'user-msg');
      chatInput.value = '';

      const thinkingDiv = appendMessage('Gemini is analyzing catalog...', 'bot-msg');

      try {
        const catalogContext = allProducts.map(p => `- ${p.title} | Price: $${p.price} | Details: ${p.description}`).join('\n');

        const promptText = `
          You are an expert AI Shopping Advisor for an online marketplace.
          Here is our current product catalog:
          ${catalogContext || "No products in store yet."}

          Instructions:
          1. Recommend products from our catalog based on user query/budget.
          2. Help users decide, compare features, and guide their purchase decisions.
          3. Be friendly, accurate, and concise.

          User Query: ${userText}
        `;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: promptText }]
            }]
          })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
          thinkingDiv.innerText = data.candidates[0].content.parts[0].text;
        } else {
          thinkingDiv.innerText = "Error getting response from Gemini.";
        }
      } catch (err) {
        console.error("Gemini Error:", err);
        thinkingDiv.innerText = "Connection error.";
      }
    });

    function appendMessage(text, className) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${className}`;
      msgDiv.innerText = text;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return msgDiv;
    }

    loadCatalog();
  </script>
</body>
</html>
