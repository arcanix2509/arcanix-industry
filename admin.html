<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - AI Marketplace</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .admin-table th, .admin-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    .admin-table th { background: #1e293b; color: white; }
    .btn-delete { background: #e11d48; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; }
    .btn-delete:hover { background: #be123c; }
  </style>
</head>
<body>

  <nav>
    <h2>⚙️ Admin Control Center</h2>
    <div style="display: flex; align-items: center; gap: 15px;">
      <a href="index.html">View Storefront</a>
      <a href="auth.html" id="admin-user-btn" style="color: #60a5fa; font-weight: bold;">Account</a>
    </div>
  </nav>

  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h1>Manage Marketplace Products</h1>
      <a href="add-product.html" class="btn" style="width: auto; margin:0; background: #16a34a;">+ Add New Product</a>
    </div>

    <table class="admin-table">
      <thead>
        <tr>
          <th>Image</th>
          <th>Title</th>
          <th>Price</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="admin-product-list">
        <tr><td colspan="4">Verifying Admin Access...</td></tr>
      </tbody>
    </table>
  </div>

  <script type="module">
    import { db, auth, onAuthStateChanged, ADMIN_EMAIL } from './firebase-config.js';
    import { collection, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const productList = document.getElementById('admin-product-list');

    // Auth Guard with delayed execution fix
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        alert("Access Denied! Please login first.");
        window.location.href = "auth.html";
        return;
      }

      if (user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        alert(`Access Denied! ${user.email} is not authorized as Admin.`);
        window.location.href = "index.html";
        return;
      }

      // If Admin is verified, load products
      loadAdminProducts();
    });

    async function loadAdminProducts() {
      try {
        productList.innerHTML = '<tr><td colspan="4">Loading products...</td></tr>';
        
        const querySnapshot = await getDocs(collection(db, "products"));
        productList.innerHTML = '';

        if (querySnapshot.empty) {
          productList.innerHTML = '<tr><td colspan="4">No products found in Firestore.</td></tr>';
          return;
        }

        querySnapshot.forEach((document) => {
          const product = document.data();
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><img src="${product.imageUrl || 'https://via.placeholder.com/50'}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;"/></td>
            <td><strong>${product.title}</strong></td>
            <td>$${product.price}</td>
            <td><button class="btn-delete" data-id="${document.id}">Delete</button></td>
          `;
          productList.appendChild(tr);
        });

        // Event listener for delete buttons
        document.querySelectorAll('.btn-delete').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const id = e.target.getAttribute('data-id');
            if (confirm("Are you sure you want to delete this product?")) {
              try {
                await deleteDoc(doc(db, "products", id));
                alert("Product deleted!");
                loadAdminProducts();
              } catch (err) {
                alert("Delete Failed: " + err.message);
              }
            }
          });
        });

      } catch (err) {
        console.error("Firestore Load Error:", err);
        productList.innerHTML = `<tr><td colspan="4" style="color:red; font-weight:bold;">Error: ${err.message}. Check Firestore Security Rules!</td></tr>`;
      }
    }
  </script>
</body>
</html>
