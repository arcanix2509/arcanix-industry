<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .admin-table th, .admin-table td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }
    .admin-table th { background: rgba(15, 23, 42, 0.9); color: var(--text-muted); font-size: 0.85rem; }
    .btn-delete {
      background: rgba(244, 63, 94, 0.2);
      color: #fda4af;
      border: 1px solid rgba(244, 63, 94, 0.4);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-delete:hover { background: rgba(244, 63, 94, 0.4); }
  </style>
</head>
<body>

  <nav>
    <h2>⚙️ Admin Control Center</h2>
    <div>
      <a href="index.html">View Storefront</a>
    </div>
  </nav>

  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
      <h2>Inventory Management</h2>
      <a href="add-product.html" class="btn" style="width: auto; background: #10b981; color: white; padding: 10px 20px;">+ Add Product</a>
    </div>

    <table class="admin-table">
      <thead>
        <tr>
          <th>Preview</th>
          <th>Product Name</th>
          <th>Price</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="admin-product-list">
        <tr><td colspan="4" style="color: var(--text-muted);">Validating permissions...</td></tr>
      </tbody>
    </table>
  </div>

  <script type="module">
    import { db, auth, onAuthStateChanged, ADMIN_EMAIL } from './firebase-config.js';
    import { collection, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const productList = document.getElementById('admin-product-list');

    onAuthStateChanged(auth, async (user) => {
      if (!user || user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        alert("Unauthorized access.");
        window.location.href = "auth.html";
        return;
      }
      loadAdminProducts();
    });

    async function loadAdminProducts() {
      try {
        const querySnapshot = await getDocs(collection(db, "products"));
        productList.innerHTML = '';

        if (querySnapshot.empty) {
          productList.innerHTML = '<tr><td colspan="4" style="color: var(--text-muted);">No products found in database.</td></tr>';
          return;
        }

        querySnapshot.forEach((docSnap) => {
          const product = docSnap.data();
          const tr = window.document.createElement('tr');
          tr.innerHTML = `
            <td><img src="${product.imageUrl || 'https://via.placeholder.com/50'}" style="width: 48px; height: 48px; object-fit: cover; border-radius: 8px;"/></td>
            <td><strong>${product.title}</strong></td>
            <td style="color: #60a5fa; font-weight:600;">$${product.price}</td>
            <td><button class="btn-delete" data-id="${docSnap.id}">Delete</button></td>
          `;
          productList.appendChild(tr);
        });

        window.document.querySelectorAll('.btn-delete').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const id = e.target.getAttribute('data-id');
            if (confirm("Delete this product permanently?")) {
              await deleteDoc(doc(db, "products", id));
              loadAdminProducts();
            }
          });
        });

      } catch (err) {
        productList.innerHTML = `<tr><td colspan="4" style="color:#f43f5e;">Error: ${err.message}</td></tr>`;
      }
    }
  </script>
</body>
</html>
