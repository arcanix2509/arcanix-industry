<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <nav>
    <div class="nav-container">
      <a href="index.html" class="brand-logo">Arcanix <span>ADMIN</span></a>
      <a href="index.html" class="nav-link">Storefront View</a>
    </div>
  </nav>

  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
      <div>
        <h2 style="font-size: 1.25rem; font-weight: 800;">Asset Inventory</h2>
        <p style="font-size: 0.825rem; color: var(--text-muted);">Manage published assets and catalog items.</p>
      </div>
      <a href="add-product.html" class="btn btn-primary">+ Add New Asset</a>
    </div>

    <table class="admin-table">
      <thead>
        <tr>
          <th>Asset</th>
          <th>Title</th>
          <th>Price</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="admin-product-list">
        <tr><td colspan="4" style="color: var(--text-muted);">Verifying admin credentials...</td></tr>
      </tbody>
    </table>
  </div>

  <script type="module">
    import { db, auth, onAuthStateChanged, ADMIN_EMAIL } from './firebase-config.js';
    import { collection, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const productList = document.getElementById('admin-product-list');

    onAuthStateChanged(auth, async (user) => {
      if (!user || user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        alert("Unauthorized access.");
        window.location.href = "auth.html";
        return;
      }
      loadAdminProducts();
    });

    async function loadAdminProducts() {
      try {
        const querySnapshot = await getDocs(collection(db, "products"));
        productList.innerHTML = '';

        if (querySnapshot.empty) {
          productList.innerHTML = '<tr><td colspan="4" style="color: var(--text-muted);">No products found in inventory.</td></tr>';
          return;
        }

        querySnapshot.forEach((docSnap) => {
          const product = docSnap.data();
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><img src="${product.imageUrl || 'https://via.placeholder.com/50'}" style="width: 42px; height: 42px; object-fit: cover; border-radius: var(--radius-sm);"/></td>
            <td><strong>${product.title}</strong></td>
            <td><strong>$${product.price}</strong></td>
            <td><button class="btn btn-danger btn-delete" data-id="${docSnap.id}">Delete</button></td>
          `;
          productList.appendChild(tr);
        });

        document.querySelectorAll('.btn-delete').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const id = e.target.getAttribute('data-id');
            if (confirm("Permanently delete this asset?")) {
              await deleteDoc(doc(db, "products", id));
              loadAdminProducts();
            }
          });
        });

      } catch (err) {
        productList.innerHTML = `<tr><td colspan="4" style="color:var(--danger);">Error: ${err.message}</td></tr>`;
      }
    }
  </script>
</body>
</html>
