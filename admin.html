<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <nav>
    <div class="nav-container">
      <a href="index.html" class="brand-logo">Arcanix <span>ADMIN</span></a>
      <a href="index.html" class="btn btn-outline">Storefront View</a>
    </div>
  </nav>

  <div class="container">
    
    <!-- Product Addition Form -->
    <div class="form-card" style="max-width: 600px; margin: 0 auto 40px auto;">
      <h3 style="margin-bottom: 16px;">Add New Asset</h3>
      <form id="add-product-form">
        <div class="form-group">
          <label>Asset Title</label>
          <input type="text" id="prod-title" required placeholder="e.g. Unity Character Locomotion Controller"/>
        </div>
        <div class="form-group">
          <label>Price ($)</label>
          <input type="number" step="0.01" id="prod-price" required placeholder="19.99"/>
        </div>
        <div class="form-group">
          <label>Image URL</label>
          <input type="url" id="prod-image" required placeholder="https://..."/>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="prod-desc" rows="3" required placeholder="Short description of asset..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Publish Asset</button>
      </form>
    </div>

    <!-- Inventory List -->
    <h3 style="margin-bottom: 16px;">Current Inventory</h3>
    <table class="admin-table">
      <thead>
        <tr>
          <th>Preview</th>
          <th>Title</th>
          <th>Price</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="admin-product-list">
        <tr><td colspan="4" style="color: var(--text-muted);">Verifying admin credentials...</td></tr>
      </tbody>
    </table>

  </div>

  <script type="module">
    import { db, auth, onAuthStateChanged, ADMIN_EMAIL } from './firebase-config.js';
    import { collection, getDocs, addDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const productList = document.getElementById('admin-product-list');
    const addForm = document.getElementById('add-product-form');

    onAuthStateChanged(auth, async (user) => {
      if (!user || user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        alert("Unauthorized access. Admin privileges required.");
        window.location.href = "auth.html";
        return;
      }
      loadAdminProducts();
    });

    // Add Product
    addForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await addDoc(collection(db, "products"), {
          title: document.getElementById('prod-title').value,
          price: parseFloat(document.getElementById('prod-price').value),
          imageUrl: document.getElementById('prod-image').value,
          description: document.getElementById('prod-desc').value,
          createdAt: new Date()
        });
        alert("Product added successfully!");
        addForm.reset();
        loadAdminProducts();
      } catch (err) {
        alert("Error adding product: " + err.message);
      }
    });

    // Load Products
    async function loadAdminProducts() {
      try {
        const querySnapshot = await getDocs(collection(db, "products"));
        productList.innerHTML = '';

        if (querySnapshot.empty) {
          productList.innerHTML = '<tr><td colspan="4" style="color: var(--text-muted);">No products found in inventory.</td></tr>';
          return;
        }

        querySnapshot.forEach((docSnap) => {
          const product = docSnap.data();
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><img src="${product.imageUrl || 'https://via.placeholder.com/50'}" style="width: 40px; height: 40px; object-fit: cover; border-radius: 4px;"/></td>
            <td><strong>${product.title}</strong></td>
            <td><strong>$${product.price}</strong></td>
            <td><button class="btn btn-danger btn-delete" data-id="${docSnap.id}">Delete</button></td>
          `;
          productList.appendChild(tr);
        });

        document.querySelectorAll('.btn-delete').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const id = e.target.getAttribute('data-id');
            if (confirm("Delete this asset?")) {
              await deleteDoc(doc(db, "products", id));
              loadAdminProducts();
            }
          });
        });

      } catch (err) {
        productList.innerHTML = `<tr><td colspan="4" style="color:var(--danger);">Error: ${err.message}</td></tr>`;
      }
    }
  </script>
</body>
</html>
