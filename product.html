<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Asset Details</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <nav>
    <div class="nav-container">
      <a href="index.html" class="brand-logo">Arcanix <span>PRO</span></a>
      <a href="index.html" class="nav-link">← Back to Store</a>
    </div>
  </nav>

  <div class="container">
    <div style="display: grid; grid-template-columns: 1fr 400px; gap: 24px;">
      
      <!-- Product Details Column -->
      <div id="product-info" class="card" style="padding: 24px;">
        <p style="color: var(--text-muted);">Loading asset details...</p>
      </div>

      <!-- AI Assistant Column -->
      <div class="chat-container">
        <div class="chat-header">
          <div style="width: 32px; height: 32px; background: var(--primary-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary); font-weight: bold;">✨</div>
          <div>
            <h4 style="font-size: 0.9rem; font-weight: 700;">Asset Sales Assistant</h4>
            <p style="font-size: 0.75rem; color: var(--text-muted);">Ask technical questions or check eligibility for discounts.</p>
          </div>
        </div>

        <div class="chat-messages" id="chat-messages">
          <div class="message ai">Hi! Ask me anything about this asset!</div>
        </div>

        <form class="chat-input-area" id="chat-form">
          <input type="text" id="chat-input" placeholder="Type your message..." required autocomplete="off"/>
          <button type="submit" class="btn btn-primary" style="width: auto;">Send</button>
        </form>
      </div>

    </div>
  </div>

  <script type="module">
    import { db, GEMINI_API_KEY } from './firebase-config.js';
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');
    let currentProduct = null;

    const productInfoContainer = document.getElementById('product-info');
    const chatMessages = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');

    async function loadProductDetails() {
      if (!productId) {
        productInfoContainer.innerHTML = "<p>Asset not found.</p>";
        return;
      }

      const docRef = doc(db, "products", productId);
      const docSnap = await getDoc(docRef);

      if (docSnap.exists()) {
        currentProduct = docSnap.data();
        productInfoContainer.innerHTML = `
          <img src="${currentProduct.imageUrl}" alt="${currentProduct.title}" style="width:100%; max-height:360px; object-fit:cover; border-radius: var(--radius-md); margin-bottom: 20px;"/>
          <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 8px;">${currentProduct.title}</h1>
          <div style="font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 16px;">$${currentProduct.price}</div>
          <p style="color: var(--text-muted); font-size: 0.925rem; white-space: pre-line;">${currentProduct.description}</p>
        `;
      } else {
        productInfoContainer.innerHTML = "<p>Product does not exist!</p>";
      }
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const userText = chatInput.value.trim();
      if (!userText || !currentProduct) return;

      appendMessage(userText, 'user');
      chatInput.value = '';

      const thinkingDiv = appendMessage('Analyzing request...', 'ai');

      try {
        const promptText = `
          You are an AI Sales Agent for this product:
          - Title: ${currentProduct.title}
          - Price: $${currentProduct.price}
          - Details: ${currentProduct.description}

          Rules: Answer product questions directly. Limit discounts to maximum 10%.
          User Query: ${userText}
        `;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
          thinkingDiv.innerText = data.candidates[0].content.parts[0].text;
        } else {
          thinkingDiv.innerText = "Could not process request.";
        }
      } catch (err) {
        thinkingDiv.innerText = "Connection failed.";
      }
    });

    function appendMessage(text, type) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${type}`;
      msgDiv.innerText = text;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return msgDiv;
    }

    loadProductDetails();
  </script>
</body>
</html>
